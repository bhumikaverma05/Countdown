<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <video autoplay muted loop playsinline class="vortex-wallpaper">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- Dark Overlay -->
  <div class="overlay"></div>

  <main class="hud">

    <h2 class="top-label">TIME LEFT</h2>

    <div class="timer-display">
      <span id="timeText">00:00:00</span>
    </div>

    <p class="status-text">Linpack Club</p>

    <!-- Progress Bar -->
    <div class="bar-wrap">
      <div class="bar-fill" id="progressBar"></div>
    </div>

    <!-- Preset Chips -->
    <div class="preset-row">
      <button onclick="setPreset(3)">3 min</button>
      <button onclick="setPreset(5)">5 min</button>
      <button onclick="setPreset(10)">10 min</button>
      <button onclick="setPreset(25)">25 min</button>
    </div>

    <!-- Inputs -->
    <div class="input-panel">
      <input type="number" id="setHours" placeholder="Hrs" min="0">
      <input type="number" id="setMinutes" placeholder="Min" min="0">
      <input type="number" id="setSeconds" placeholder="Sec" min="0">
    </div>

    <!-- Buttons -->
    <div class="control-panel">
      <button id="startBtn" onclick="startTimer()">Start</button>
      <button id="pauseBtn" onclick="pauseTimer()">Pause</button>
      <button id="resetBtn" onclick="resetTimer()">Reset</button>
    </div>

  </main>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-box">
      <h2>Mission Complete</h2>
      <p id="popup-message"></p>
      <button onclick="closePopup()">Return</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
